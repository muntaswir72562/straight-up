name: Desktop app (Windows installer)

on:
  push:
    branches: [scan-book-application]
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write   # attach the installer to a GitHub Release (tags only)

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            desktop/engine-requirements.txt

      # ── Next.js standalone server ────────────────────────────────────
      - name: Install web dependencies
        run: npm ci

      - name: Build Next.js (standalone)
        run: npx next build

      - name: Prepare server for the desktop app
        run: node desktop/scripts/prepare-server.js

      # ── Python engine (PyInstaller, onedir) ──────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/engine-requirements.txt

      - name: Build engine
        working-directory: desktop
        run: pyinstaller engine.spec --noconfirm --distpath resources --workpath ../build/pyi

      # ── Tesseract (UB Mannheim build + tessdata_best eng/fra) ────────
      - name: Fetch Tesseract
        shell: pwsh
        run: ./desktop/scripts/fetch-tesseract.ps1

      # ── Tests ────────────────────────────────────────────────────────
      - name: Python tests
        env:
          TESSERACT_CMD: ${{ github.workspace }}\desktop\resources\tesseract\tesseract.exe
          TESSDATA_PREFIX: ${{ github.workspace }}\desktop\resources\tesseract\tessdata
          OMP_THREAD_LIMIT: '1'
        run: |
          python scripts/test_page_audit.py
          python scripts/test_scan_capture.py

      - name: Smoke test the built engine (no Python on PATH)
        run: python desktop/smoke/smoke_test.py desktop/resources/engine/engine.exe --tesseract desktop/resources/tesseract/tesseract.exe

      # ── Installer ────────────────────────────────────────────────────
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned for now (see desktop/README.md)
        run: npx electron-builder --win --x64 --publish never

      - name: Installer size
        shell: pwsh
        run: |
          $f = Get-Item desktop/dist/StraightUp-Setup.exe
          "{0} {1:N0} MB" -f $f.Name, ($f.Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: StraightUp-Setup
          path: desktop/dist/StraightUp-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/StraightUp-Setup.exe
