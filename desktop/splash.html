<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
  <title>Straight Up</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: #f7f6f3; color: #1d1f2e; font-family: "Segoe UI", system-ui, sans-serif;
      border: 1px solid #d8d9e3; box-sizing: border-box; -webkit-app-region: drag; user-select: none;
    }
    img { width: 64px; height: 64px; }
    h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
    p { margin: 0; font-size: 13px; color: #5a5d72; }
    .bar { width: 160px; height: 4px; border-radius: 2px; background: #e3e3ec; overflow: hidden; }
    .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: #3b3fb0;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <img src="build/icon.png" alt="">
  <h1>Straight Up</h1>
  <div class="bar"></div>
  <p>Starting…</p>
</body>
</html>
